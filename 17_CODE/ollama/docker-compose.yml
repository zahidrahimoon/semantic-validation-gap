# Ollama (CPU only) for the semantic-validation-gap testbed.
# Usage:  docker compose up -d        # start
#         docker compose exec ollama ollama pull qwen3:4b
#         docker compose down          # stop (models persist in the named volume)
services:
  ollama:
    image: ollama/ollama:latest
    container_name: svg-ollama
    ports:
      - "11434:11434"
    volumes:
      - svg_ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped
volumes:
  svg_ollama_models:
